[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "indexing-exam-variant02"
version = "1.0.0"
description = "Exam project: text indexing, variant 02 (tasks 2,3,4,7,11)"
requires-python = ">=3.10"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
